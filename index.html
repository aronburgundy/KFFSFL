<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KFFSFL Historical Record</title>
    <link rel="stylesheet" href="kffsfl.css" />
    <script src="league-history.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="header">
      <div class="dropdown" data-dropdown>
        <button class="link" data-dropdown-button>Totals</button>
        <div class="dropdown-menu">
          <div>
            <div class="manager-list">
              <table>
                <thead>
                  <tr>
                    <td>MANAGER</td>
                    <td>SEASONS ('SHIPS)</td>
                  </tr>
                </thead>
                <tbody id="current-manager-totals"></tbody>
              </table>
            </div>

            <div class="manager-list" id="past-managers">
              <h4>Retired Managers</h4>
              <table>
                <tbody id="retired-manager-totals"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <a href="https://docs.google.com/spreadsheets/d/1AdjjMjzgrjgWbpFq5_9qrXjDVbQe2S0cnpRF4S5dQF4/edit?usp=sharing" target="_blank" class="link">Tabulation</a>
      <a href="https://sleeper.com/leagues/1388533495994798080/league" target="_blank" class="link">Sleeper 2026</a>
      <a href="https://docs.google.com/document/d/1WL7WS-saUxNBlA3lc85WgKgq8CJm8PgzmfFFvIv6-r0/edit?usp=sharing" target="_blank" class="link">SeasonDoc</a>
      <a href="https://docs.google.com/document/d/1VROUAtF0JoJ5tipB4h_XQqOcJg7sUuOSb80tPFPitWY/edit?usp=sharing" target="_blank" class="link">Constitution</a>
    </div>

    <div class="title">
      <h1>
        <img class="title-emblem" src="images/Hammer_and_sickle_red_on_transparent.svg.webp" alt="Hammer and sickle" />
        KFFSFL Historical Record
        <img src="images/1203px-Football_Icon.svg.png" />
      </h1>
    </div>

    <div class="middle">
      <div class="current-champion" id="current-champion"></div>
    </div>

    <section class="card-list" id="season-cards"></section>
  </body>
</html>
